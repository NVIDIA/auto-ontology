# Deliberately a separate distribution from `gsf-server`, not an extra on it.
# The MCP server reaches GSF over HTTP like any other client, so it needs none
# of the backend's database drivers or model tooling — installing
# `gsf-server` to run it would pull ~450 packages and over a gigabyte, and it
# would inherit that project's git dependencies. These four deps install in
# seconds, which is what makes `uvx gsf-mcp` practical on a laptop.

[project]
name = "gsf-mcp"
version = "0.1.0"
description = "MCP server exposing the GSF semantic layer to agent harnesses"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastmcp>=3.2.4,<4",
    "httpx>=0.28.1",
    "pydantic>=2",
    "python-dotenv>=1.0",
]

[project.scripts]
gsf-mcp = "gsf_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gsf_mcp"]

# The tool surface is generated from this spec at startup, so it has to travel
# with the package. Kept in sync with docs/openapi/gsf-api.json by
# `pnpm openapi`, which writes both copies, and enforced by CI.
[tool.hatch.build.targets.wheel.force-include]
"gsf_mcp/gsf-api.json" = "gsf_mcp/gsf-api.json"
"gsf_mcp/nvidia-mark.svg" = "gsf_mcp/nvidia-mark.svg"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[dependency-groups]
dev = ["pytest>=8"]

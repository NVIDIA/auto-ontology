# Default values for the GSF Helm chart.

# Global image pull policy. With minikube + locally-built images,
# IfNotPresent prevents the cluster from trying to pull from a remote registry.
imagePullPolicy: IfNotPresent

# Image pull secrets for private registries (e.g. nvcr.io). Empty for local /
# minikube (public images). A deployment overlay can set, e.g.:
#   imagePullSecrets:
#     - name: nvcr-creds
imagePullSecrets: []

# When enabled, the chart renders an in-cluster Secret (<release>-secrets) from
# the values below — convenient for local / minikube. Disable it when an
# external mechanism (e.g. the External Secrets Operator) supplies that Secret.
bundledSecret:
  enabled: true

# Extra annotations merged into the backend / ingestion / frontend pod templates.
# A GitOps overlay can bump a value here (e.g. rolledAt) to force a fresh rollout
# even when image references are unchanged.
podAnnotations: {}

# ------------------------------------------------------------------
# Shared credentials — populate a single k8s Secret (<release>-secrets)
# consumed by all GSF workloads.
# ------------------------------------------------------------------
# Postgres
postgresUser: gsf
postgresPassword: ""
postgresDatabase: gsf
# Neo4j
neo4jUsername: neo4j
neo4jPassword: ""
# pgAdmin
pgadminEmail: admin@example.com
pgadminPassword: admin
# NVIDIA NIM
nvidiaApiKey: ""
baseUrl: "https://integrate.api.nvidia.com/v1"
modelName: "nvidia/nemotron-3-nano-30b-a3b"
# Optional dedicated model for entity extraction in the text-to-SQL pipeline.
# When empty, entity extraction falls back to modelName.
entityExtractionModel: "meta/llama-3.1-8b-instruct"
# KumoRFM (predictions). Leave the key empty to disable the prediction tool.
kumoRfmApiKey: ""
kumoRfmApiUrl: "https://kumorfm.ai/api"
embedEndpoint: "https://integrate.api.nvidia.com/v1"
embedModel: "nvidia/llama-nemotron-embed-vl-1b-v2"
# Ingestion targets - comma-separated list of PG URLs the worker reads from.
connectionStrings: ""
# Better Auth signing key (sessions, CSRF, OIDC state). Leave empty to
# auto-generate a stable random secret on first install and preserve it across
# upgrades. Set explicitly to share one value across environments/replicas.
authSecret: ""
# Public origin of the app — REQUIRED by Better Auth (sessions, CSRF, OIDC
# redirect URIs). It must match the URL you actually browse to, or auth
# requests 404 / fail CSRF. The default works when reaching the frontend via
# `kubectl port-forward svc/frontend 3000:3000`. For NodePort/ingress/https,
# set this to that exact origin (e.g. https://gsf.example.com).
appUrl: "http://localhost:3000"
# Bootstrap admin account. REQUIRED — self-service sign-up is disabled, so this
# is the only way the initial admin is provisioned. The frontend creates this
# admin on first start (email-verified), or resets its password to this value
# on subsequent starts. Leaving either empty fails the install/upgrade.
adminEmail: ""
adminPassword: ""

# ------------------------------------------------------------------
# Postgres (pgvector)
# ------------------------------------------------------------------
postgres:
  image:
    repository: pgvector/pgvector
    tag: pg17
  service:
    port: 5432
  persistence:
    size: 5Gi
    # Set to a specific class on clusters without a default dynamic provisioner
    # (e.g. Astra pdx02: pdx02-cdot03-ainfs01-nfsv3). Empty = cluster default.
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

# ------------------------------------------------------------------
# pgAdmin
# ------------------------------------------------------------------
pgadmin:
  # Optional DB admin UI. Handy for local/minikube; disabled on Astra via the
  # deploy overlay (gsf.pgadmin.enabled=false).
  enabled: true
  image:
    repository: dpage/pgadmin4
    tag: latest
  service:
    port: 80
    nodePort: 30050
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

# ------------------------------------------------------------------
# Neo4j
# ------------------------------------------------------------------
neo4j:
  image:
    repository: neo4j
    tag: latest
  service:
    httpPort: 7474
    boltPort: 7687
  persistence:
    dataSize: 5Gi
    logsSize: 1Gi
    pluginsSize: 1Gi
    importSize: 1Gi
    # Set to a specific class on clusters without a default dynamic provisioner
    # (e.g. Astra pdx02: pdx02-cdot03-ainfs01-nfsv3). Empty = cluster default.
    storageClassName: ""
  resources:
    requests:
      cpu: 200m
      memory: 1Gi

# ------------------------------------------------------------------
# GSF FastAPI backend
# ------------------------------------------------------------------
backend:
  image:
    repository: nvcr.io/nvstaging/gsf/gsf
    tag: 0.0.1
    # digest: ""  # e.g. sha256:...; overrides tag when set (immutable pin)
  service:
    port: 3001
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

# ------------------------------------------------------------------
# Ingestion worker (exposes an HTTP API the backend calls to trigger ingest)
# ------------------------------------------------------------------
ingestion:
  image:
    # Reuses the backend image with a different entrypoint arg.
    repository: nvcr.io/nvstaging/gsf/gsf
    tag: 0.0.1
    # digest: ""  # e.g. sha256:...; overrides tag when set (immutable pin)
  service:
    port: 3002
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

# ------------------------------------------------------------------
# Next.js frontend
# ------------------------------------------------------------------
frontend:
  image:
    repository: nvcr.io/nvstaging/gsf/gsf-frontend
    tag: 0.0.1
    # digest: ""  # e.g. sha256:...; overrides tag when set (immutable pin)
  service:
    port: 3000
    nodePort: 30000
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    {{- include "gsf.componentLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "frontend") | nindent 4 }}
spec:
  type: NodePort
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: 3000
      nodePort: {{ .Values.frontend.service.nodePort }}
  selector:
    {{- include "gsf.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "gsf.componentLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "gsf.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gsf.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "gsf.imagePullSecrets" . | nindent 6 }}
      initContainers:
        {{- include "gsf.waitForDeps" . | nindent 8 }}
        {{- include "gsf.waitForSchema" . | nindent 8 }}
      containers:
        - name: frontend
          image: "{{ include "gsf.image" .Values.frontend.image }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: {{ include "gsf.secretName" . }}
          env:
            - name: PYTHON_API_URL
              value: "http://gsf:{{ .Values.backend.service.port }}"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            # GSF version shown in the app header. Sourced from the Helm chart
            # version so the UI always reflects the deployed chart.
            - name: APP_VERSION
              value: {{ .Chart.Version | quote }}
            {{- if .Values.appUrl }}
            # Public origin of the app. Used by Better Auth for session cookies,
            # CSRF, and OIDC redirect URIs. Must match the URL you browse to.
            - name: APP_URL
              value: {{ .Values.appUrl | quote }}
            {{- end }}
            {{- if .Values.mcpPublicUrl }}
            # Public MCP origin. Better Auth binds tokens to its /mcp endpoint.
            - name: GSF_MCP_PUBLIC_URL
              value: {{ .Values.mcpPublicUrl | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}

apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    {{- include "gsf.componentLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "frontend") | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type | default "NodePort" }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: 3000
      {{- if eq (.Values.frontend.service.type | default "NodePort") "NodePort" }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
  selector:
    {{- include "gsf.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "gsf.componentLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  # Recreate under the tight namespace quota (limits.cpu=10) to avoid a
  # rolling-update surge deadlocking on CPU quota.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "gsf.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gsf.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 8 }}
    spec:
      {{- include "gsf.imagePullSecrets" . | nindent 6 }}
      initContainers:
        {{- include "gsf.waitForDeps" . | nindent 8 }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: {{ include "gsf.secretName" . }}
          env:
            - name: PYTHON_API_URL
              value: "http://gsf:{{ .Values.backend.service.port }}"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}

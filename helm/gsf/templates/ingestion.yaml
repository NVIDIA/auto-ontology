apiVersion: v1
kind: Service
metadata:
  # Fixed name (no fullname prefix) so the in-cluster URL is stable and matches
  # INGESTION_SERVICE_URL: http://ingestion-service:3002
  name: ingestion-service
  labels:
    {{- include "gsf.componentLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "ingestion") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.ingestion.service.port }}
      targetPort: 3002
  selector:
    {{- include "gsf.componentSelectorLabels" (dict "root" . "component" "ingestion") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  labels:
    {{- include "gsf.componentLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "ingestion") | nindent 4 }}
spec:
  replicas: {{ .Values.ingestion.replicas }}
  selector:
    matchLabels:
      {{- include "gsf.componentSelectorLabels" (dict "root" . "component" "ingestion") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gsf.componentSelectorLabels" (dict "root" . "component" "ingestion") | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "gsf.imagePullSecrets" . | nindent 6 }}
      initContainers:
        {{- include "gsf.waitForDeps" . | nindent 8 }}
        {{- include "gsf.waitForCatalogSchema" . | nindent 8 }}
      containers:
        - name: ingestion
          image: "{{ include "gsf.image" .Values.ingestion.image }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["ingestion_service"]
          ports:
            - name: http
              containerPort: 3002
          envFrom:
            - secretRef:
                name: {{ include "gsf.secretName" . }}
          env:
            # App version, logged at startup. Sourced from the Helm chart version.
            - name: APP_VERSION
              value: {{ .Chart.Version | quote }}
          readinessProbe:
            # /health/ready, not /health: the latter checks no dependencies, so
            # as a readiness probe it can never fail and the pod reports Ready
            # whether or not an ingest could actually run. This one probes
            # Postgres and the schema revision, same as the backend's.
            httpGet:
              path: /health/ready
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            # Deliberately the dependency-free endpoint: restarting this process
            # cannot fix an unreachable database, so a liveness probe gated on
            # one turns a database blip into a rolling restart. Without any
            # liveness probe at all — which is what this was — a wedged process
            # is never restarted either.
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.ingestion.resources | nindent 12 }}

{{/*
Runs `prisma db push` to sync the Postgres schema with prisma/schema.prisma.

Hook timing: post-install / post-upgrade. Postgres comes up in the same
release, so a pre-install hook would race the StatefulSet. Post-install
runs after the StatefulSet exists but the Job's own init container waits
for Postgres to be reachable, so first-install works.

No `--accept-data-loss`: if the live DB has tables/columns outside the
Prisma schema (e.g. `nv_ingest_tabular` written by ingestion), this
intentionally refuses to drop them and the Job fails. Resolve drift by
hand rather than silently dropping data.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: frontend-migrate
  labels:
    {{- include "gsf.componentLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "frontend-migrate") | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "gsf.componentSelectorLabels" (dict "root" . "component" "frontend-migrate") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command:
            - sh
            - -c
            - |
              until nc -z postgres {{ .Values.postgres.service.port }}; do
                echo "waiting for postgres..."
                sleep 2
              done
          {{- include "gsf.initResources" . | nindent 10 }}
      containers:
        - name: prisma-migrate
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          workingDir: /app/migrate
          envFrom:
            - secretRef:
                name: {{ include "gsf.secretName" . }}
          command:
            - node
            - node_modules/prisma/build/index.js
            - db
            - push
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

{{/*
Runs `prisma db push` to sync the Postgres schema with prisma/schema.prisma.

Hook timing: post-install / post-upgrade. Postgres comes up in the same
release, so a pre-install hook would race the StatefulSet. Post-install
runs after the StatefulSet exists but the Job's own init container waits
for Postgres to be reachable, so first-install works.

Prisma is scoped to the `public` schema only (schemas = ["public"] +
multiSchema). Ingestion's vector table lives in the separate `vdb` schema
(see gsf/vdb), so `db push` never sees it and cannot drop it.

No `--accept-data-loss`: if the `public` schema still drifts from
prisma/schema.prisma, this intentionally refuses to drop and the Job
fails. Resolve drift by hand rather than silently dropping data.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: frontend-migrate
  labels:
    {{- include "gsf.componentLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "frontend-migrate") | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "gsf.componentSelectorLabels" (dict "root" . "component" "frontend-migrate") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- include "gsf.imagePullSecrets" . | nindent 6 }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command:
            - sh
            - -c
            - |
              until nc -z postgres {{ .Values.postgres.service.port }}; do
                echo "waiting for postgres..."
                sleep 2
              done
          {{- include "gsf.initResources" . | nindent 10 }}
      containers:
        - name: prisma-migrate
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          workingDir: /app/migrate
          env:
            # Prisma's query engine needs a writable cache dir; OpenShift runs
            # the pod as an arbitrary UID without a home, so point HOME at /tmp.
            - name: HOME
              value: /tmp
          envFrom:
            - secretRef:
                name: {{ include "gsf.secretName" . }}
          command:
            - sh
            - -c
            - |
              # On a fresh database this creates the Prisma-managed tables.
              # When Postgres is a SHARED database that also hosts agent/
              # ingestion tables (e.g. CONNECTION_STRINGS points at this same
              # DB), `db push` would refuse with a data-loss warning because it
              # wants the DB to match the Prisma schema exactly. In that case
              # the Prisma tables already exist, so treat the refusal as a
              # no-op instead of failing the release. Any other error is fatal.
              if node node_modules/prisma/build/index.js db push 2>/tmp/migrate-err; then
                cat /tmp/migrate-err
                echo "prisma db push: applied"
              elif grep -q 'accept-data-loss' /tmp/migrate-err; then
                cat /tmp/migrate-err
                echo "prisma db push: skipped (shared DB already populated; Prisma tables assumed present)"
              else
                cat /tmp/migrate-err >&2
                exit 1
              fi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

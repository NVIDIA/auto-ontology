{{- $pvcs := list
  (dict "name" "data" "size" .Values.neo4j.persistence.dataSize)
  (dict "name" "logs" "size" .Values.neo4j.persistence.logsSize)
  (dict "name" "plugins" "size" .Values.neo4j.persistence.pluginsSize)
  (dict "name" "import" "size" .Values.neo4j.persistence.importSize)
}}
{{- range $pvc := $pvcs }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neo4j-{{ $pvc.name }}
  labels:
    {{- include "gsf.componentLabels" (dict "Chart" $.Chart "Release" $.Release "Values" $.Values "component" "neo4j") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with $.Values.neo4j.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $pvc.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  labels:
    {{- include "gsf.componentLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "neo4j") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.neo4j.service.httpPort }}
      targetPort: 7474
    - name: bolt
      port: {{ .Values.neo4j.service.boltPort }}
      targetPort: 7687
  selector:
    {{- include "gsf.componentSelectorLabels" (dict "root" . "component" "neo4j") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  labels:
    {{- include "gsf.componentLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "neo4j") | nindent 4 }}
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      {{- include "gsf.componentSelectorLabels" (dict "root" . "component" "neo4j") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gsf.componentSelectorLabels" (dict "root" . "component" "neo4j") | nindent 8 }}
    spec:
      containers:
        - name: neo4j
          image: "{{ .Values.neo4j.image.repository }}:{{ .Values.neo4j.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 7474
            - name: bolt
              containerPort: 7687
          env:
            - name: NEO4J_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "gsf.secretName" . }}
                  key: NEO4J_USERNAME
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gsf.secretName" . }}
                  key: NEO4J_PASSWORD
            - name: NEO4J_AUTH
              value: "$(NEO4J_USERNAME)/$(NEO4J_PASSWORD)"
            - name: NEO4J_PLUGINS
              value: '["apoc"]'
            - name: NEO4J_server_config_strict__validation_enabled
              value: "false"
            - name: NEO4J_apoc_export_file_enabled
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
            - name: plugins
              mountPath: /plugins
          readinessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            {{- toYaml .Values.neo4j.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: neo4j-data
        - name: logs
          persistentVolumeClaim:
            claimName: neo4j-logs
        - name: plugins
          persistentVolumeClaim:
            claimName: neo4j-plugins

apiVersion: v1
kind: Service
metadata:
  # Fixed name (no fullname prefix) so the in-cluster URL matches the value
  # baked into the Next.js rewrites manifest at build time: http://gsf:3001
  name: gsf
  labels:
    {{- include "gsf.componentLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: 3001
  selector:
    {{- include "gsf.componentSelectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gsf.fullname" . }}
  labels:
    {{- include "gsf.componentLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "backend") | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "gsf.componentSelectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gsf.componentSelectorLabels" (dict "root" . "component" "backend") | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "gsf.imagePullSecrets" . | nindent 6 }}
      initContainers:
        {{- include "gsf.waitForDeps" . | nindent 8 }}
        {{- include "gsf.waitForCatalogSchema" . | nindent 8 }}
      containers:
        - name: backend
          image: "{{ include "gsf.image" .Values.backend.image }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["server"]
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - secretRef:
                name: {{ include "gsf.secretName" . }}
          env:
            - name: PORT
              value: "3001"
            # App version, logged at startup. Sourced from the Helm chart version.
            - name: APP_VERSION
              value: {{ .Chart.Version | quote }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}

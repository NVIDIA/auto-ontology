apiVersion: v1
kind: Service
metadata:
  # Fixed name (no fullname prefix) so the in-cluster URL is stable and matches
  # INGESTION_SERVICE_URL: http://ingestion-service:3002
  name: ingestion-service
  labels:
    {{- include "auto-ontology.componentLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "ingestion") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.ingestion.service.port }}
      targetPort: 3002
  selector:
    {{- include "auto-ontology.componentSelectorLabels" (dict "root" . "component" "ingestion") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  labels:
    {{- include "auto-ontology.componentLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "ingestion") | nindent 4 }}
spec:
  replicas: {{ .Values.ingestion.replicas }}
  selector:
    matchLabels:
      {{- include "auto-ontology.componentSelectorLabels" (dict "root" . "component" "ingestion") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "auto-ontology.componentSelectorLabels" (dict "root" . "component" "ingestion") | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "auto-ontology.imagePullSecrets" . | nindent 6 }}
      initContainers:
        {{- include "auto-ontology.waitForDeps" . | nindent 8 }}
        {{- include "auto-ontology.waitForCatalogSchema" . | nindent 8 }}
      containers:
        - name: ingestion
          image: "{{ include "auto-ontology.image" .Values.ingestion.image }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["ingestion_service"]
          ports:
            - name: http
              containerPort: 3002
          envFrom:
            - secretRef:
                name: {{ include "auto-ontology.secretName" . }}
          env:
            # App version, logged at startup. Sourced from the Helm chart version.
            - name: APP_VERSION
              value: {{ .Chart.Version | quote }}
          # Same paths and same meanings as the backend's, deliberately: these
          # two blocks should be copyable between the charts without changing
          # what they test.
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            # Deliberately not /health: that one probes Postgres, and a liveness
            # probe gated on an external dependency restarts a healthy service
            # whenever the database is slow. Without any liveness probe at all —
            # which is what this was — a wedged process is never restarted.
            httpGet:
              path: /health/live
              port: 3002
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.ingestion.resources | nindent 12 }}

apiVersion: v1
kind: Service
metadata:
  # Fixed name (no fullname prefix) so the in-cluster URL matches the value
  # baked into the Next.js rewrites manifest at build time: http://auto-ontology:3001
  name: auto-ontology
  labels:
    {{- include "auto-ontology.componentLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: 3001
  selector:
    {{- include "auto-ontology.componentSelectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
{{- $documents := .Values.backend.documents.persistence }}
{{- $rwo := and $documents.enabled (eq $documents.accessMode "ReadWriteOnce") }}
{{- if and $rwo (gt (int .Values.backend.replicas) 1) }}
{{- fail "backend.replicas > 1 needs backend.documents.persistence.accessMode ReadWriteMany" }}
{{- end }}
{{- if $documents.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "auto-ontology.fullname" . }}-documents
  labels:
    {{- include "auto-ontology.componentLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "backend") | nindent 4 }}
spec:
  accessModes: [{{ $documents.accessMode | quote }}]
  {{- with $documents.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $documents.size }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "auto-ontology.fullname" . }}
  labels:
    {{- include "auto-ontology.componentLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "backend") | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  {{- if $rwo }}
  # A ReadWriteOnce volume cannot attach to a new Pod on another node while the
  # old one still holds it, so a rolling update could hang.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "auto-ontology.componentSelectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "auto-ontology.componentSelectorLabels" (dict "root" . "component" "backend") | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "auto-ontology.imagePullSecrets" . | nindent 6 }}
      {{- if $documents.enabled }}
      # The image runs as uid/gid 1000; a fresh volume is root-owned.
      securityContext:
        fsGroup: 1000
      {{- end }}
      initContainers:
        {{- include "auto-ontology.waitForDeps" . | nindent 8 }}
        {{- include "auto-ontology.waitForCatalogSchema" . | nindent 8 }}
      containers:
        - name: backend
          image: "{{ include "auto-ontology.image" .Values.backend.image }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["server"]
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - secretRef:
                name: {{ include "auto-ontology.secretName" . }}
          env:
            - name: PORT
              value: "3001"
            # App version, logged at startup. Sourced from the Helm chart version.
            - name: APP_VERSION
              value: {{ .Chart.Version | quote }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            # Deliberately not /api/health: that one probes Postgres, and a
            # liveness probe gated on an external dependency restarts a healthy
            # backend whenever the database is slow.
            httpGet:
              path: /api/health/live
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- if $documents.enabled }}
          volumeMounts:
            - name: documents
              mountPath: /data/documents
      volumes:
        - name: documents
          persistentVolumeClaim:
            claimName: {{ include "auto-ontology.fullname" . }}-documents
          {{- end }}

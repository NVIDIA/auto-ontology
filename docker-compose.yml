services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  neo4j:
    image: neo4j:latest
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_config_strict__validation_enabled: "false"
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_dbms_security_auth__minimum__password__length: "3"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
      - neo4j_import:/var/lib/neo4j/import
    healthcheck:
      test:
        [
          "CMD",
          "cypher-shell",
          "-u",
          "neo4j",
          "-p",
          "${NEO4J_PASSWORD}",
          "RETURN 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  gsf:
    build:
      context: .
      dockerfile: Dockerfile
    image: gsf:latest
    container_name: gsf
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      # In-network port; POSTGRES_PORT in .env is the host-side mapping.
      POSTGRES_PORT: "5432"
      NEO4J_URI: bolt://neo4j:7687
      INGESTION_SERVICE_URL: http://ingestion-service:3002
      # Source DB override: reach the pgvector container by service name, not
      # localhost (which resolves to this container inside the compose network).
      CONNECTION_STRINGS: postgresql://postgres:tomer_is_my_queen@postgres:5432/amazon
    depends_on:
      postgres:
        condition: service_started
      neo4j:
        condition: service_healthy
      ingestion-service:
        condition: service_started

  ingestion-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: gsf:latest
    container_name: gsf-ingestion-service
    restart: unless-stopped
    command: ["ingestion_service"]
    ports:
      - "3002:3002"
    # The image healthcheck targets the backend (:3001/api/health);
    # the ingestion service serves /health on :3002.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3002/health', timeout=3).status == 200 else 1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      NEO4J_URI: bolt://neo4j:7687
      # Source DB override: reach the pgvector container by service name, not
      # localhost (which resolves to this container inside the compose network).
      CONNECTION_STRINGS: postgresql://postgres:tomer_is_my_queen@postgres:5432/amazon
    depends_on:
      postgres:
        condition: service_started
      neo4j:
        condition: service_healthy

  # One-shot Job: sync the Postgres schema from prisma/schema.prisma via
  # `prisma db push` (mirrors the Helm `frontend-migrate` hook). Runs without
  # --accept-data-loss, so it refuses to drop tables outside the Prisma schema.
  frontend-migrate:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PYTHON_API_URL: ${PYTHON_API_URL:-http://gsf:3001}
    image: gsf-frontend:latest
    container_name: gsf-frontend-migrate
    working_dir: /app/migrate
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    command: ["node", "node_modules/prisma/build/index.js", "db", "push"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  gsf-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PYTHON_API_URL: ${PYTHON_API_URL:-http://gsf:3001}
    image: gsf-frontend:latest
    container_name: gsf-frontend
    restart: unless-stopped
    ports:
      - "3100:3000"
    env_file:
      - .env
    environment:
      PYTHON_API_URL: ${PYTHON_API_URL:-http://gsf:3001}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      # Healthy (not just started): the frontend's seed-admin syncs the admin
      # user to the backend at boot and fails if :3001 isn't accepting yet.
      gsf:
        condition: service_healthy
      frontend-migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  pgadmin_data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  neo4j_import:

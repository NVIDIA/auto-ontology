[project]
name = "gsf-server"
version = "0.1.1"
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "hvac>=2.4.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "nemo-retriever>=26.8.1",
    "pydantic>=2.13.5",
    # Capped by nemo-retriever, not by us: 26.8.1 requires `pandas>=2.0,<3`,
    # so pandas 3 is unresolvable until it moves.
    "pandas>=2.3.3,<3",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.4",
    "pyheavydb>=8.0.1.post1",
    # `heavydb/version.py` does `import importlib_metadata` -- the backport, not
    # the stdlib `importlib.metadata` -- but pyheavydb does not declare it. It
    # used to arrive transitively; an upgrade dropped whatever was carrying it
    # and every `import gsf.connectors` started failing at collection. Declared
    # here so the next upgrade cannot take it away again.
    "importlib-metadata>=8.7.1",
    "python-dotenv>=1.2.3",
    "snowflake-connector-python>=4.7.2",
    "uvicorn[standard]>=0.52.4",
    "nvidia-sdfm[kumorfm]>=0.2.1",
    "databricks-sql-connector>=4.4.0",
    "mysql-connector-python>=26.7.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "apache-ossie-nvidia-gsf",
    "langchain-postgres>=0.0.17",
    "pyhive[hive-pure-sasl]>=0.7.0",
    "thrift>=0.24.0",
    "thrift-sasl>=0.4.3",
    "pure-sasl>=0.6.2",
    "pyjks>=20.0.0",
    "trino>=0.339.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gsf"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "vendored-sdfm"
url = "vendor/wheels"
format = "flat"

[tool.uv.sources]
# Upstream moved this from `converters/gsf` to `converters/nvidia` and renamed
# the distribution and its import package (`ossie_gsf` -> `ossie_nvidia_gsf`).
# The three names GSF imports are unchanged.
apache-ossie-nvidia-gsf = { git = "https://github.com/apache/ossie.git", subdirectory = "converters/nvidia" }
# apache-ossie-nvidia-gsf = { path = "../ossie/converters/nvidia", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

# Stated, not inherited. With no `select` at all, the rule set is whatever the
# installed ruff happens to default to -- and 0.16 widened that default from
# `E4,E7,E9,F` to some twenty families (B, BLE, S, SIM, TRY, UP, ...), turning a
# routine version bump into 541 findings in code nobody had touched.
#
# These are the rules the codebase was written against and passes cleanly. The
# wider set is worth adopting deliberately, as its own change: a good part of it
# argues with patterns that are intentional here -- BLE001 and S110 against the
# best-effort `except Exception` around reads whose failure is meant to
# degrade rather than raise, for instance -- so it needs judgement per rule, not
# a bulk `--fix`.
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"

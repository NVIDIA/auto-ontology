[project]
name = "gsf-server"
version = "0.1.1"
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb>=1.5.2",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "hvac>=2.4.0",
    "langchain-openai>=1.3.0",
    "langchain-postgres>=0.0.17",
    "nemo-retriever[tabular] @ git+https://github.com/NVIDIA/NeMo-Retriever.git#subdirectory=nemo_retriever",
    "pydantic>=2.0",
    "neo4j>=6.1.0",
    "pandas>=2.0,<3",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.3",
    "pyheavydb>=8.0.1.post1",
    "python-dotenv>=1.2.2",
    "snowflake-connector-python>=4.6.0",
    "uvicorn[standard]>=0.32.0",
    "nvidia-sdfm[kumorfm]>=0.1.0",
    "databricks-sql-connector>=4.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The nemo-retriever dependency is a git direct reference; hatchling requires
# opting in to bake it into the built wheel/sdist metadata (so it resolves for
# downstream projects that install GSF straight from git).
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["gsf"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "vendored-sdfm"
url = "vendor/wheels"
format = "flat"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"

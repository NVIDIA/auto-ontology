[project]
name = "auto-ontology-server"
version = "1.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "hvac>=2.4.0",
    # Capped at 1.3.4, the last release that accepts openai<2.45.0; see the openai pin.
    "langchain-openai>=1.3.0,<1.3.5",
    "langgraph>=1.2.11",
    # Exact pin, so consumers that install this package (ontology-sql-eval) get
    # the version tested here; they never see this lockfile. 26.8.2 rejects the
    # inference-api embed model id ("not revision-pinned") and fails every ingest.
    "nemo-retriever==26.8.1",
    "pydantic>=2.13.5",
    # Capped by nemo-retriever, not by us: 26.8.1 requires `pandas>=2.0,<3`,
    # so pandas 3 is unresolvable until it moves.
    "pandas>=2.3.3,<3",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.4",
    "pyheavydb>=8.0.1.post1",
    # `heavydb/version.py` does `import importlib_metadata` -- the backport, not
    # the stdlib `importlib.metadata` -- but pyheavydb does not declare it. It
    # used to arrive transitively; an upgrade dropped whatever was carrying it
    # and every `import auto_ontology.connectors` started failing at collection. Declared
    # here so the next upgrade cannot take it away again.
    "importlib-metadata>=8.7.1",
    "python-dotenv>=1.2.3",
    "snowflake-connector-python>=4.7.2",
    "uvicorn[standard]>=0.52.4",
    "databricks-sql-connector>=4.4.0",
    "mysql-connector-python>=26.7.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "apache-ossie-nvidia-auto-ontology @ git+https://github.com/liofnv/ossie.git@678c07550a68fbd2adb9afb5a0bc7a91ac42cce2#subdirectory=converters/nvidia",
    "langchain-postgres>=0.0.17",
    "pyhive[hive-pure-sasl]>=0.7.0",
    "thrift>=0.24.0",
    "thrift-sasl>=0.4.3",
    "pure-sasl>=0.6.2",
    "pyjks>=20.0.0",
    "trino>=0.339.0",
    # Not imported directly (comes in via langchain-openai). Pinned to the version
    # nemo-gym 0.6.0 declares, so this matches the ontology-sql-eval harness.
    "openai==2.44.0",
    # Imported directly but previously only installed transitively. Declared so
    # dropping whatever carried them cannot break an import the way pyheavydb's
    # importlib-metadata did; langchain-nvidia-ai-endpoints arrived solely via
    # nemo-retriever.
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-core>=1.6.1",
    "sqlglot>=30.17.0",
    "numpy>=2.5.2",
    "requests>=2.34.2",
    "tqdm>=4.70.0",
    "cryptography>=50.0.1",
]

[project.optional-dependencies]
kumo = ["kumo-relational-client[relational]>=1.0.0,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auto_ontology"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = true
# Patched versions of transitive dependencies flagged by nSpect.
# PyJWT is a constraint, so its dependents' upper bounds still apply. urllib3
# is an override because nemo-retriever pins urllib3==2.7.0 exactly; an
# override replaces every other range, so it keeps the <3 bound requests and
# botocore declare.
constraint-dependencies = [
    "pyjwt>=2.15.1",  # BDSA-2026-35552 (via databricks/snowflake connectors, mcp)
    "virtualenv>=21.14.2",  # CVE-2026-102930 (via ray)
]
override-dependencies = [
    "urllib3>=2.8.0,<3",  # BDSA-2026-35861, BDSA-2026-35864 (via requests, botocore, nemo-retriever)
]
# Excluded to fix a critical vulnerability (CVE-2026-55203) in the HAProxy binary
# bundled with ray-haproxy. We don't depend on it directly: nemo-retriever pulls
# it in through ray[serve] (nemo-retriever -> ray[data,serve] -> ray-haproxy).
# No patched ray-haproxy release exists yet, so it is removed instead of upgraded.
# Nothing in this project starts Ray Serve, so the binary is never used.
exclude-dependencies = [
    "ray-haproxy",
]

[[tool.uv.index]]
name = "vendored-engine"
url = "vendor/wheels"
format = "flat"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
release = [
    "ngcsdk>=4.37.0",
    "pyyaml>=6.0.3",
]

# Stated, not inherited. With no `select` at all, the rule set is whatever the
# installed ruff happens to default to -- and 0.16 widened that default from
# `E4,E7,E9,F` to some twenty families (B, BLE, S, SIM, TRY, UP, ...), turning a
# routine version bump into 541 findings in code nobody had touched.
#
# These are the rules the codebase was written against and passes cleanly. The
# wider set is worth adopting deliberately, as its own change: a good part of it
# argues with patterns that are intentional here -- BLE001 and S110 against the
# best-effort `except Exception` around reads whose failure is meant to
# degrade rather than raise, for instance -- so it needs judgement per rule, not
# a bulk `--fix`.
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
# mcp/ is a separate project with its own venv and CI workflow. It must stay out
# of this suite: pythonpath = ["."] would otherwise make the mcp/ directory
# shadow the installed mcp SDK as a namespace package.
addopts = "--import-mode=importlib --ignore=mcp"

[project]
name = "gsf-server"
version = "0.1.1"
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb>=1.5.2",
    "fastapi>=0.115.0",
    "langchain-postgres>=0.0.17",
    "nemo-retriever[tabular]",
    "neo4j>=6.1.0",
    "pandas>=2.0,<3",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.3",
    "pyheavydb>=8.0.1.post1",
    "python-dotenv>=1.2.2",
    "snowflake-connector-python>=4.6.0",
    "uvicorn[standard]>=0.32.0",
]

[tool.uv]
package = false

[tool.uv.sources]
nemo-retriever = { git = "https://github.com/NVIDIA/NeMo-Retriever.git", subdirectory = "nemo_retriever" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.15.9",
]

# Builds the GSF Next.js frontend image and pushes it to nvcr.io. The Astra
# deploy repo consumes it by digest; GitHub and GitLab stay decoupled, linked
# only through nvcr.io (mirrors staging-publish-image.yml). Requires repo secret:
#   NGC_API_KEY - an NGC API key with push access to nvcr.io/nvstaging/gsf
#
# PYTHON_API_URL is baked into the Next.js rewrite manifest at build time
# (Next.js evaluates rewrites() during `next build`), so it must point at the
# in-cluster backend Service — http://gsf:3001, the same default the chart uses.

name: 'Staging: Publish frontend image to nvcr.io'

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Override image tag (default: stg.<timestamp>)'
        required: false
  push:
    branches: [main, feat/astra-nightly-deploy]
    paths:
      - 'frontend/**'
      - '.github/workflows/staging-publish-frontend.yml'

env:
  # nvcr.io allows only org/team/image (3 segments); the frontend has its own
  # repo, distinct from the app/chart repo (nvcr.io/nvstaging/gsf/gsf).
  IMAGE: nvcr.io/nvstaging/gsf/gsf-frontend
  # Baked into the Next.js rewrites at build time; must match the in-cluster
  # backend Service name created by the helm chart.
  PYTHON_API_URL: http://gsf:3001

jobs:
  publish-frontend:
    name: Build & push amd64 frontend image
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compute image tag
        id: meta
        run: |
          set -euo pipefail
          # Staging frontend images: tag is stg.<UTC ts> only (no version prefix).
          # The constant "stg." prefix lets the deploy repo's nightly roll
          # (gsf/gsf-demo-deploy: ci/roll-stg.sh) pick the newest frontend image
          # by recency, matching the app-image convention.
          t='${{ github.event.inputs.tag }}'
          if [ -z "$t" ]; then
            t="stg.$(date -u +%Y%m%d%H%M%S)"
          fi
          echo "tag=$t" >>"$GITHUB_OUTPUT"
          echo "Image tag: $t"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to nvcr.io
        uses: docker/login-action@v3
        with:
          registry: nvcr.io
          username: '$oauthtoken'
          password: ${{ secrets.NGC_API_KEY }}

      - name: Build & push (linux/amd64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            PYTHON_API_URL=${{ env.PYTHON_API_URL }}
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          provenance: false

      - name: Summary
        run: |
          {
            echo "### Published frontend image"
            echo ""
            echo "- Image: \`${IMAGE}:${{ steps.meta.outputs.tag }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "Pin in the umbrella as:"
            echo '```yaml'
            echo "    frontend:"
            echo "      image:"
            echo "        repository: ${IMAGE}"
            echo "        tag: ${{ steps.meta.outputs.tag }}"
            echo "        digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

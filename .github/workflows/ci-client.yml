name: Client CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'

defaults:
  run:
    working-directory: frontend

jobs:
  lint_and_build:
    name: Prettier, ESLint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: '10.33.0'
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier check
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: Build
        run: pnpm build

  build_image:
    name: Build frontend image
    runs-on: ubuntu-latest
    # Override the workflow-level `working-directory: frontend`: this job's first
    # `run:` step (Free disk space) executes before checkout, when `frontend/`
    # does not exist yet. `uses:` actions ignore this anyway, so the
    # build-push-action `context: ./frontend` still resolves from the repo root.
    defaults:
      run:
        working-directory: .
    # The `secrets` context is not allowed in `if:` expressions, so surface the
    # NGC key as an env var and gate the nvcr.io login on that instead.
    env:
      NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to nvcr.io (for base image)
        if: ${{ env.NGC_API_KEY != '' }}
        uses: docker/login-action@v4
        with:
          registry: nvcr.io
          username: '$oauthtoken'
          password: ${{ env.NGC_API_KEY }}

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          build-args: |
            PYTHON_API_URL=http://auto-ontology:3001
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: false

#
# Labelled search entities for dev_tools/calibrate_vdb.py, written against the
# seeded fixture (pagila + chinook catalogs, and the hand-authored semantic
# layer in dev_tools/fixtures/seed_graph_fixture.py).
#
# Each entry is one short phrase, as the clarification flow's entity
# extraction would hand it to the vector store, with the rows that would be a
# correct match:
#
#   entity:   the search text
#   layer:    data (Table/Column rows) or semantic (Term/ColumnAttribute rows)
#   label:    the label filter the app would search with
#   database: the database filter
#   kind:     paraphrase  -- the words differ from the column's; vector search's job
#             identifier  -- the column name as written; BM25's job
#             near_miss   -- sounds like something in the catalog, isn't
#             unrelated   -- nothing like it in the catalog
#   expect:   correct targets; any one ranked first counts. For the data layer
#             "schema.table.column", for the semantic layer the attribute name.
#             Empty for near_miss and unrelated: a correct gate rejects them.
#
# Several pagila views repeat a base column (film.length, film_list.length,
# nicer_but_slower_film_list.length); each lists every copy, because the store
# has no way to prefer one and either is a right answer.

# --- data layer, pagila: paraphrases ----------------------------------------
- {entity: movie length, layer: data, label: Column, database: pagila, kind: paraphrase,
   expect: [public.film.length, public.film_list.length, public.nicer_but_slower_film_list.length]}
- {entity: price to rent a movie, layer: data, label: Column, database: pagila, kind: paraphrase,
   expect: [public.film.rental_rate, public.film_list.price, public.nicer_but_slower_film_list.price]}
- {entity: cost to replace a lost dvd, layer: data, label: Column, database: pagila, kind: paraphrase,

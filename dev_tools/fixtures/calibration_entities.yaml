- {entity: revenue earned by a film, layer: data, label: Column, database: pagila, kind: paraphrase,
   expect: [analytics.film_performance.revenue, analytics.top_films.revenue]}
- {entity: number of times a film was rented, layer: data, label: Column, database: pagila, kind: paraphrase,
   expect: [analytics.film_performance.rental_count, analytics.top_films.rental_count]}
- {entity: staff login name, layer: data, label: Column, database: pagila, kind: paraphrase,
   expect: [public.staff.username]}
- {entity: bonus material on the disc, layer: data, label: Column, database: pagila, kind: paraphrase,
